y: grid;\n  grid-template-columns: 136px 1fr auto;\n  gap: 18px;\n  align-items: center;\n  padding: 18px;\n  border-radius: 24px;\n  background:\n    radial-gradient(circle at 10% 0%, rgba(37,99,235,.12), transparent 36%),\n    #fff;\n  border: 1px solid #E2E8F0;\n  margin-bottom: 18px;\n}\n.sg-risk-ring {\n  width: 114px;\n  height: 114px;\n  border-radius: 999px;\n  display: grid;\n  place-items: center;\n  position: relative;\n  background: conic-gradient(#DC2626 var(--sg-score, 8%), #E2E8F0 0);\n}\n.sg-risk-ring::after {\n  content: \"\";\n  position: absolute;\n  width: 84px;\n  height: 84px;\n  border-radius: 999px;\n  background: #fff;\n}\n.sg-risk-ring span {\n  position: relative;\n  z-index: 1;\n  color: #DC2626;\n  font-size: 28px;\n  font-weight: 950;\n  letter-spacing: -.05em;\n}\n.sg-risk-copy h3 {\n  margin: 0 0 7px;\n  color: #0F172A;\n  font-size: 18px;\n  font-weight: 950;\n}\n.sg-risk-copy p {\n  margin: 0;\n  color: #64748B;\n  font-size: 13px;\n  line-height: 1.55;\n}\n.sg-risk-badge {\n  justify-self: end;\n  display: inline-flex;\n  align-items: center;\n  border-radius: 999px;\n  padding: 8px 11px;\n  color: #991B1B;\n  background: #FEE2E2;\n  font-size: 11px;\n  font-weight: 950;\n  text-transform: uppercase;\n  letter-spacing: .06em;\n}\n.sg-pipeline-list {\n  position: relative;\n  display: grid;\n  gap: 12px;\n}\n.sg-pipeline-list::before {\n  content: \"\";\n  position: absolute;\n  left: 27px;\n  top: 18px;\n  bottom: 18px;\n  width: 2px;\n  background: linear-gradient(180deg, rgba(37,99,235,.22), rgba(56,189,248,.22), rgba(220,38,38,.18));\n}\n.sg-stage-row {\n  position: relative;\n  display: grid;\n  grid-template-columns: 56px 1fr auto;\n  gap: 14px;\n  align-items: center;\n  border-radius: 20px;\n  padding: 14px;\n  background: #fff;\n  border: 1px solid #E2E8F0;\n  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;\n}\n.sg-stage-icon {\n  position: relative;\n  z-index: 1;\n  width: 42px;\n  height: 4     document.head.appendChild(style);

  function wireDemo() {
    var button = document.getElementById("sg-run-demo");
    if (!button || button.dataset.sgWired === "1") return;
    button.dataset.sgWired = "1";

    var scores = [8, 18, 41, 68, 84, 96];
    var titles = [
      "Monitoring call",
      "Protected call connected",
      "Transcript analyzed",
      "High-risk phrase detected",
      "Event saved",
      "Automatic protection triggered"
    ];
    var copy = [
      "SilentGuard is waiting for scam indicators in the live transcript.",
      "The call is routed through the protected SilentGuard flow.",
      "Live speech is converted into transcript segments for analysis.",
      "Urgency and verification-code language push the risk score into the danger zone.",
      "The event is stored with transcript, risk score, signals, and action.",
      "A guardian alert is sent and the dangerous call is automatically disconnected."
    ];
    var badges = ["Low risk", "Low risk", "Medium risk", "High risk", "High risk", "Critical risk"];

    button.addEventListener("click", function () {
      var steps = Array.prototype.slice.call(document.querySelectorAll("[data-sg-step]"));
      var lines = Array.prototype.slice.call(document.querySelectorAll("[data-sg-line]"));
      var ring = document.getElementById("sg-risk-ring");
      var value = document.getElementById("sg-risk-value");
      var title = document.getElementById("sg-risk-title");
      var body = document.getElementById("sg-risk-copy");
      var badge = document.getElementById("sg-risk-badge");
      var callState = document.getElementById("sg-call-state");

      steps.forEach(function (s) { s.classList.remove("sg-active"); });
      lines.forEach(function (l) { l.classList.remove("sg-active"); });
      if (callState) callState.textContent = "Call active";
      button.disabled = true;
      button.textContent = "Running protection...";

      scores.forEach(function (n, i) {
        setTimeout(function () {
          if (steps[i]) steps[i].classList.add("sg-active");
          if (lines[Math.min(i, 3)]) lines[Math.min(i, 3)].classList.add("sg-active");
          if (ring) ring.style.setProperty("--sg-score", n + "%");
          if (value) value.textContent = String(n).padStart(2, "0");
          if (title) title.textContent = titles[i];
          if (body) body.textContent = copy[i];
          if (badge) badge.textContent = badges[i];
          if (i === scores.length - 1) {
            if (callState) callState.textContent = "Call disconnected";
            button.disabled = false;
            button.textContent = "Replay protection demo";
          }
        }, i * 620);
      });
    });
  }

  function injectDemo() {
    installStyles();
    if (document.getElementById("sg-pipeline-demo")) {
      wireDemo();
      return;
    }
    var hero = document.querySelector(".landing-hero-wrap");
    if (!hero) return;
    hero.insertAdjacentHTML("afterend", demoMarkup);
    wireDemo();
  }

  window.addEventListener("DOMContentLoaded", function () {
    injectDemo();
    var root = document.getElementById("root");
    if (!root || !window.MutationObserver) return;
    new MutationObserver(function () { injectDemo(); }).observe(root, { childList: true, subtree: true });
  });
})();

  </script>
